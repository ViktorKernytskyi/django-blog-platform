{% extends 'blog/base.html' %}


{% block content %}


<div class="post">


    {% if post.published_date %}


    <div class="date">


        {{ post.published_date }}


    </div>


    {% endif %}
{% if user.is_authenticated %}
<a class="d-flex justify-content-end" href="{% url 'post_edit' pk=post.pk %}" title="Edit file">
    <i class="bi bi-pencil"></i>
</a>
    {% endif %}
    <h1>{{ post.title }}</h1>


    <p>{{ post.text|linebreaksbr }}</p>


</div>


{% endblock %}
